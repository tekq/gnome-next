name: Build GNOME Next

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

# GitHub-hosted runners cap out at 6h (360 min) per job no matter what you
# put in timeout-minutes - see
# https://docs.github.com/en/actions/learn-github-actions/usage-limits-billing-and-administration#usage-limits
# That's the actual reason this is split into one job per package instead
# of a single job building gsettings-desktop-schemas through gnome-shell in
# sequence: a monolithic job would blow straight through the ceiling.
#
# CACHING - read before using this file:
#   This workflow assumes a Cachix cache (`vars.CACHIX_CACHE_NAME` +
#   `secrets.CACHIX_AUTH_TOKEN`). Cachix's free tier is 5GB for open
#   source projects - a GNOME shell closure will not fit in that for long,
#   so budget for a paid tier, or swap the cachix-action step for a
#   self-hosted attic cache. See README.md for the tradeoffs, including
#   why garnix.io may be a better fit than any of this GHA plumbing.

jobs:
  # Independent leaf packages: nothing this flake overrides depends on any
  # of the others here, so they build in parallel with no ordering
  # constraints.
  build-independent:
    strategy:
      fail-fast: false
      matrix:
        package:
          - gsettings-desktop-schemas
          - gnome-desktop
          - gnome-backgrounds
          - gnome-settings-daemon
    runs-on: ubuntu-latest
    timeout-minutes: 360
    steps:
      - uses: actions/checkout@v5

      - uses: cachix/install-nix-action@v31

      # Free, zero-config, backed by the GitHub Actions cache. This only
      # speeds up *this repo's* CI runs - it isn't a public cache your
      # NixOS machine can substitute from - so it's a complement to
      # Cachix below, not a replacement for it.
      - uses: DeterminateSystems/magic-nix-cache-action@main

      # The durable, public cache your actual NixOS machine pulls from.
      - uses: cachix/cachix-action@v17
        with:
          name: ${{ vars.CACHIX_CACHE_NAME }}
          authToken: ${{ secrets.CACHIX_AUTH_TOKEN }}

      - run: nix build ".#${{ matrix.package }}" -L

  # mutter and gnome-session both build fine against just the independent
  # set above, but nothing here is order-dependent between the two of
  # them, so they fan out again rather than chaining.
  build-mutter:
    needs: build-independent
    runs-on: ubuntu-latest
    timeout-minutes: 360
    steps:
      - uses: actions/checkout@v5
      - uses: cachix/install-nix-action@v31
      - uses: DeterminateSystems/magic-nix-cache-action@main
      - uses: cachix/cachix-action@v17
        with:
          name: ${{ vars.CACHIX_CACHE_NAME }}
          authToken: ${{ secrets.CACHIX_AUTH_TOKEN }}
      - run: nix build .#mutter -L

  build-gnome-session:
    needs: build-independent
    runs-on: ubuntu-latest
    timeout-minutes: 360
    steps:
      - uses: actions/checkout@v5
      - uses: cachix/install-nix-action@v31
      - uses: DeterminateSystems/magic-nix-cache-action@main
      - uses: cachix/cachix-action@v17
        with:
          name: ${{ vars.CACHIX_CACHE_NAME }}
          authToken: ${{ secrets.CACHIX_AUTH_TOKEN }}
      - run: nix build .#gnome-session -L

  # The one that (per the overlay's warning comment) somehow drags webkit
  # into the closure. Runs last, alone, with the full 6h budget and
  # everything it can reuse already sitting in cache. If it still times
  # out, see README.md for further splitting / self-hosted-runner options.
  build-gnome-shell:
    needs: [build-mutter, build-gnome-session]
    runs-on: ubuntu-latest
    timeout-minutes: 360
    steps:
      - uses: actions/checkout@v5
      - uses: cachix/install-nix-action@v31
      - uses: DeterminateSystems/magic-nix-cache-action@main
      - uses: cachix/cachix-action@v17
        with:
          name: ${{ vars.CACHIX_CACHE_NAME }}
          authToken: ${{ secrets.CACHIX_AUTH_TOKEN }}
      - run: nix build .#gnome-shell -L
